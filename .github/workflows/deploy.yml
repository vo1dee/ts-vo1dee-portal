name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir dist
          cp -r index.html pz.html css js dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7aee858c783df142885fb6cea2f5f0d1
          command: pages deploy dist --project-name=ts-vo1dee-portal --branch=main
